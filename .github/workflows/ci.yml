name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -warnaserror --no-restore -c Release
      - run: dotnet test tests/UnitTest --no-build -c Release
      - run: dotnet test tests/IntegrationTest --no-build -c Release
      - run: dotnet pack libs/Postway --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/
