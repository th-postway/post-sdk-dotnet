name: CI

# git-flow: develop is the integration branch, release/* and hotfix/* carry a version, main holds releases.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - name: Release branch must be SemVer and match the version
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ver="${BRANCH#*/}"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' libs/Postway/Postway.csproj)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "branch $BRANCH must be named <type>/MAJOR.MINOR.PATCH"; exit 1; fi
          if [ "$ver" != "$version" ]; then echo "branch $BRANCH does not match package version $version"; exit 1; fi
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -warnaserror --no-restore -c Release
      - run: dotnet test tests/UnitTest --no-build -c Release
      - run: dotnet test tests/IntegrationTest --no-build -c Release
      - run: dotnet pack libs/Postway --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/
