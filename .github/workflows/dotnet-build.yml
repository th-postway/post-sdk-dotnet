name: Build .NET Core Libraries

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore Postway.sln
      - name: Build solution for testing
        run: dotnet build Postway.sln --configuration Debug --no-restore
      - name: Run tests
        run: dotnet test Postway.sln --no-build --verbosity normal
      - name: Build with release configuration
        run: |
          dotnet build Postway.sln --configuration Release --no-restore
          dotnet publish libs/Postway/Postway.csproj --configuration Release --output ./artifacts --no-build --no-restore
          echo "Build and publish completed successfully."
